services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medvito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medvito}
      POSTGRES_DB: ${POSTGRES_DB:-medvito}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    image: postgres:17-alpine
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT_INTERNAL: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-medvito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medvito}
      POSTGRES_DB: ${POSTGRES_DB:-medvito}
    volumes:
      - ./dumps:/dumps:ro
      - ./docker/postgres/init-db.sh:/init-db.sh:ro
    entrypoint: ["/bin/sh", "/init-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api-go
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-medvito}:${POSTGRES_PASSWORD:-medvito}@postgres:5432/${POSTGRES_DB:-medvito}?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      MTS_TOKEN: ${MTS_TOKEN:-}
      NOTISEND_API_KEY: ${NOTISEND_API_KEY:-}
      NOTISEND_PROJECT: ${NOTISEND_PROJECT:-torgui_sam}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_TLS_INSECURE: ${SMTP_TLS_INSECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DADATA_API_KEY: ${DADATA_API_KEY:-}
      AI_MODERATION_ENABLED: ${AI_MODERATION_ENABLED:-true}
      AI_MODERATION_POLL_INTERVAL_SECONDS: ${AI_MODERATION_POLL_INTERVAL_SECONDS:-30}
      AI_MODERATION_BATCH_SIZE: ${AI_MODERATION_BATCH_SIZE:-5}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      TINKOFF_TERMINAL_KEY: ${TINKOFF_TERMINAL_KEY:-}
      TINKOFF_SECRET_KEY: ${TINKOFF_SECRET_KEY:-}
      DEAL_PLATFORM_FEE_PERCENT: ${DEAL_PLATFORM_FEE_PERCENT:-0}
      DEAL_PAYOUT_DELAY_DAYS: ${DEAL_PAYOUT_DELAY_DAYS:-1}
      DEAL_AUTO_COMPLETE_DAYS: ${DEAL_AUTO_COMPLETE_DAYS:-14}
      RESERVATION_DEFAULT_HOURS: ${RESERVATION_DEFAULT_HOURS:-24}
      RESERVATION_MAX_HOURS: ${RESERVATION_MAX_HOURS:-72}
      RESERVATION_MAX_ACTIVE: ${RESERVATION_MAX_ACTIVE:-5}
      RESERVATION_DAILY_LIMIT: ${RESERVATION_DAILY_LIMIT:-4}
      RESERVATION_BLOCK_DAYS: ${RESERVATION_BLOCK_DAYS:-7}
      CDEK_CLIENT_ID: ${CDEK_CLIENT_ID:-}
      CDEK_CLIENT_SECRET: ${CDEK_CLIENT_SECRET:-}
      CDEK_API_BASE: ${CDEK_API_BASE:-https://api.edu.cdek.ru/v2}
      VK_OAUTH_CLIENT_ID: ${VK_OAUTH_CLIENT_ID:-}
      VK_OAUTH_CLIENT_SECRET: ${VK_OAUTH_CLIENT_SECRET:-}
      VK_OAUTH_REDIRECT_URI: ${VK_OAUTH_REDIRECT_URI:-}
      VK_OAUTH_AUTHORIZE_URL: ${VK_OAUTH_AUTHORIZE_URL:-https://oauth.vk.com/authorize}
      VK_OAUTH_TOKEN_URL: ${VK_OAUTH_TOKEN_URL:-https://oauth.vk.com/access_token}
      VK_OAUTH_USERINFO_URL: ${VK_OAUTH_USERINFO_URL:-https://api.vk.com/method/users.get}
      VK_OAUTH_SCOPE: ${VK_OAUTH_SCOPE:-email}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_PUBLIC_BASE: ${S3_PUBLIC_BASE:-}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-}
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
